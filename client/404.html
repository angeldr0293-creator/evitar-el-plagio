<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada - Originalidad Académica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      align-items: center;
      background:
        radial-gradient(circle at 20% 18%, rgba(43,122,104,0.12), transparent 28%),
        linear-gradient(115deg, #fbfaf7 0%, #f7faf9 58%, #edf4f4 100%);
      color: #071832;
      display: grid;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: rgba(255,255,255,0.86);
      border: 1px solid #dfe7ea;
      border-radius: 22px;
      box-shadow: 0 28px 60px rgba(7,24,50,0.08);
      margin: 0 auto;
      max-width: 620px;
      padding: 34px;
      text-align: center;
    }

    .code {
      color: #2b7a68;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 54px);
      line-height: 1.08;
      margin-bottom: 12px;
    }

    p {
      color: #475569;
      margin: 0 auto 24px;
      max-width: 480px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a {
      align-items: center;
      border-radius: 12px;
      display: inline-flex;
      font-weight: 800;
      min-height: 48px;
      padding: 12px 18px;
      text-decoration: none;
    }

    .primary {
      background: #071832;
      box-shadow: 0 12px 24px rgba(7,24,50,0.18);
      color: white;
    }

    .secondary {
      background: white;
      border: 1px solid #d8e0e5;
      color: #071832;
    }

    @media (max-width: 520px) {
      main {
        padding: 26px 20px;
      }

      a {
        justify-content: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>La ruta que abriste no está disponible. Puedes volver al inicio o entrar a tu panel para continuar.</p>
    <div class="actions">
      <a class="primary" href="index.html">Volver al inicio</a>
      <a class="secondary" href="panel.html">Ir a mi panel</a>
    </div>
  </main>
</body>
</html>

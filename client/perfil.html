<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil - ZeroCopy IA</title>
  <link rel="stylesheet" href="css/notifications.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f8faf9; color: #071832; font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
    .container { width: min(92%, 1120px); margin: 0 auto; }
    .site-header { background: rgba(255,255,255,0.94); border-bottom: 1px solid #dfe6ea; position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); }
    .nav { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; color: #071832; text-decoration: none; }
    .brand-mark { width: 38px; height: 38px; color: #071832; display: inline-flex; }
    .brand-mark svg, svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .brand-title { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 700; line-height: 1.1; }
    .brand-subtitle { color: #475569; display: block; font-size: 13px; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn, .ghost-btn { border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; min-height: 44px; padding: 10px 16px; text-decoration: none; }
    .btn { background: #071832; border: 1px solid #071832; color: white; }
    .ghost-btn { background: white; border: 1px solid #d8e0e5; color: #071832; }
    main { padding: 34px 0 72px; }
    .hero { background: linear-gradient(135deg, #071832, #123c43); border-radius: 22px; color: white; margin-bottom: 24px; padding: 30px; }
    .hero h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 4vw, 50px); line-height: 1.08; }
    .hero p { color: #dbe7e6; margin-top: 8px; }
    .grid { display: grid; gap: 18px; grid-template-columns: 1.15fr 0.85fr; }
    .panel { background: white; border: 1px solid #e2e9ec; border-radius: 18px; box-shadow: 0 14px 34px rgba(7,24,50,0.05); padding: 24px; }
    .panel h2 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; line-height: 1.2; margin-bottom: 14px; }
    .detail-grid { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
    .detail-card, .history-row { background: #f8faf9; border: 1px solid #e8eef1; border-radius: 14px; color: #475569; padding: 14px; }
    .detail-card strong, .history-row strong { color: #071832; display: block; margin-bottom: 3px; }
    .history-list { display: grid; gap: 10px; }
    .password-form { display: grid; gap: 12px; }
    .password-form input { border: 1px solid #d8e0e5; border-radius: 12px; color: #071832; font: inherit; padding: 12px; width: 100%; }
    .message { color: #11493f; font-size: 13px; font-weight: 800; }
    @media (max-width: 760px) {
      .grid, .detail-grid { grid-template-columns: 1fr; }
      .brand-subtitle { display: none; }
      .nav-actions { gap: 6px; }
      .ghost-btn, .btn { font-size: 13px; padding: 8px 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <nav class="nav">
        <a href="panel.html" class="brand">
          <span class="brand-mark brand-logo" aria-hidden="true" style="width:72px;height:48px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;"><img src="assets/zerocopy-logo-header.png" alt="" style="width:100%;height:100%;object-fit:contain;display:block;" /></span>
          <span><span class="brand-title" style="white-space:nowrap;">ZeroCopy IA <small style="color:#2b7a68;font-family:Arial, Helvetica, sans-serif;font-size:10px;font-weight:800;letter-spacing:0;margin-left:4px;vertical-align:middle;white-space:nowrap;">by RT</small></span><span class="brand-subtitle">Perfil del estudiante</span></span>
        </a>
        <div class="nav-actions">
          <a class="ghost-btn" href="panel.html">Panel</a>
          <button class="ghost-btn" type="button" onclick="logout()">Cerrar sesión</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <h1>Mi perfil</h1>
        <p>Consulta tus datos de cuenta, número de suscriptor, historial de pagos y seguridad.</p>
      </section>

      <div class="grid">
        <section class="panel">
          <h2>Datos registrados</h2>
          <div class="detail-grid">
            <div class="detail-card"><strong>No. suscriptor</strong><span id="subscriber-id">-</span></div>
            <div class="detail-card"><strong>Nombre</strong><span id="profile-name">-</span></div>
            <div class="detail-card"><strong>Correo</strong><span id="profile-email">-</span></div>
            <div class="detail-card"><strong>Teléfono</strong><span id="profile-phone">-</span></div>
            <div class="detail-card"><strong>Cliente desde</strong><span id="profile-created">-</span></div>
            <div class="detail-card"><strong>Solicitudes enviadas</strong><span id="profile-requests">0</span></div>
          </div>
        </section>

        <section class="panel">
          <h2>Seguridad</h2>
          <form id="password-form" class="password-form">
            <input id="current-password" type="password" placeholder="Contraseña actual" required />
            <input id="new-password" type="password" placeholder="Nueva contraseña" minlength="6" required />
            <button class="btn" type="submit">Cambiar contraseña</button>
            <span id="password-message" class="message"></span>
          </form>
        </section>

        <section class="panel">
          <h2>Historial de pagos</h2>
          <div id="payment-history" class="history-list"></div>
        </section>

        <section class="panel">
          <h2>Resumen de trabajos</h2>
          <div id="work-history" class="history-list"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="auth/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    const user = getCurrentUser();

    if (!user) {
      window.location.href = "registro.html?next=perfil.html";
    }

    if (isAdminUser(user)) {
      window.location.href = "admin.html";
    }

    if (isTeacherUser(user)) {
      window.location.href = "perfil-profesor.html";
    }

    const packageNames = { inicial: "Inicial", academico: "Académico", premium: "Premium" };

    function escapeHTML(value) {
      return String(value || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "-";
      return new Intl.DateTimeFormat("es", { year: "numeric", month: "short", day: "numeric" }).format(new Date(value));
    }

    function renderProfile() {
      const requests = getCurrentUserRequests();
      const subscriptions = getCurrentUserSubscriptions();
      document.getElementById("subscriber-id").textContent = getSubscriberId(user);
      document.getElementById("profile-name").textContent = user.name || "-";
      document.getElementById("profile-email").textContent = user.email || "-";
      document.getElementById("profile-phone").textContent = user.phone || "Sin teléfono";
      document.getElementById("profile-created").textContent = formatDate(user.createdAt);
      document.getElementById("profile-requests").textContent = requests.length;
      document.getElementById("payment-history").innerHTML = subscriptions.length
        ? subscriptions.map((subscription) => `
          <article class="history-row">
            <strong>${escapeHTML(packageNames[subscription.plan] || subscription.plan)}</strong>
            Estado: ${escapeHTML(subscription.status || "Pendiente")}<br />
            Monto: ${formatMoney(subscription.amount || 0)} ${escapeHTML(subscription.currency || "USD")}<br />
            Metodo: ${escapeHTML(subscription.paymentMethod || "-")}<br />
            Registro: ${formatDate(subscription.createdAt || subscription.startsAt)}<br />
            Vence: ${formatDate(subscription.expiresAt)}<br />
            Referencia: ${escapeHTML(subscription.transactionId || subscription.paymentToken || "Sin referencia")}<br />
            ${subscription.paymentProof ? `<a href="${escapeHTML(subscription.paymentProof.url)}" target="_blank" rel="noopener">Ver comprobante</a>` : "Comprobante pendiente"}
          </article>
        `).join("")
        : `<div class="history-row">Sin pagos registrados.</div>`;
      document.getElementById("work-history").innerHTML = requests.length
        ? requests.map((request) => `
          <article class="history-row">
            <strong>${escapeHTML(request.documentType || "Documento académico")}</strong>
            Estado: ${escapeHTML(getClientRequestStatusLabel(request))}<br />
            Páginas: ${escapeHTML(request.pages || "-")} · Créditos invertidos: ${Number(request.pages || 0) * 2}<br />
            Fecha: ${formatDate(request.createdAt)}
          </article>
        `).join("")
        : `<div class="history-row">Sin solicitudes todavía.</div>`;
    }

    document.getElementById("password-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const message = document.getElementById("password-message");
      try {
        changeOwnPassword(document.getElementById("current-password").value, document.getElementById("new-password").value);
        event.currentTarget.reset();
        message.textContent = "Contraseña actualizada.";
      } catch (error) {
        message.textContent = error.message || "No se pudo cambiar la contraseña.";
      }
    });

    renderProfile();
  </script>
</body>
</html>
